name: workflow-rabbitmq-demo
services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.2-management}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Use start-local.ps1}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Use start-local.ps1}
      RABBITMQ_DEFAULT_VHOST: workflow-demo
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  rabbitmq-data:
